<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1729"/>
      <stop offset="80%" stop-color="#0a1729" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1729" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="#0a1729"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <rect width="1000" height="220" fill="url(#fade)"/>

  <!-- corner registration marks -->
  <g stroke="#00e0ff" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M18 34 V18 H34" fill="none"/>
    <path d="M966 18 H982 V34" fill="none"/>
    <path d="M982 186 V202 H966" fill="none"/>
    <path d="M34 202 H18 V186" fill="none"/>
  </g>

  <text x="60" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#5c8aa3">// PERFIL T&#201;CNICO &#183; REV. 2026</text>

  <text x="58" y="118" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.5" fill="#f2f8fc">Andr&#233; Silva</text>

  <line x1="60" y1="138" x2="500" y2="138" stroke="#1e3a54" stroke-width="1"/>

  <text x="60" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#00e0ff">Senior Software Developer &amp; Architect</text>
  <rect x="447" y="153" width="9" height="18" fill="#00e0ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- decorative node/connector diagram, bottom right -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#5c8aa3">
    <line x1="700" y1="188" x2="740" y2="188" stroke="#2c5876" stroke-width="1" stroke-dasharray="3 4"/>
    <rect x="742" y="180" width="16" height="16" fill="none" stroke="#00e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="758" y1="188" x2="798" y2="188" stroke="#2c5876" stroke-width="1" stroke-dasharray="3 4"/>
    <rect x="800" y="180" width="16" height="16" fill="none" stroke="#00e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="816" y1="188" x2="856" y2="188" stroke="#2c5876" stroke-width="1" stroke-dasharray="3 4"/>
    <rect x="858" y="180" width="16" height="16" fill="none" stroke="#00e0ff" stroke-opacity="0.5" stroke-width="1"/>
  </g>
</svg>
