<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#0a1729"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- corner registration marks -->
  <g stroke="#00e0ff" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M18 34 V18 H34" fill="none"/>
    <path d="M966 18 H982 V34" fill="none"/>
    <path d="M982 566 V582 H966" fill="none"/>
    <path d="M34 582 H18 V566" fill="none"/>
  </g>

  <text x="60" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#5c8aa3">// PERFIL T&#201;CNICO &#183; REV. 2026</text>

  <text x="58" y="118" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.5" fill="#f2f8fc">Andr&#233; Silva</text>

  <line x1="60" y1="138" x2="500" y2="138" stroke="#1e3a54" stroke-width="1"/>

  <text x="60" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#00e0ff">Senior Software Developer &amp; Architect</text>
  <rect x="447" y="153" width="9" height="18" fill="#00e0ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="196" x2="940" y2="196" stroke="#16283d" stroke-width="1"/>

  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#5c8aa3">// SOBRE</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#9fb9cc">
    <text x="60" y="262">Desenvolvedor de Software especializado em sistemas distribu&#237;dos, arquiteturas</text>
    <text x="60" y="288">de alta disponibilidade e resili&#234;ncia. Projetei e sustentei o core de plataformas</text>
    <text x="60" y="314">processando <tspan font-weight="700" fill="#f2f8fc">milh&#245;es de requisi&#231;&#245;es por minuto</tspan> para uma base de</text>
    <text x="60" y="340">mais de <tspan font-weight="700" fill="#f2f8fc">30 milh&#245;es de usu&#225;rios ativos</tspan>.</text>

    <text x="60" y="382">Minha atua&#231;&#227;o foca na intersec&#231;&#227;o entre <tspan font-weight="700" fill="#f2f8fc">engenharia rigorosa, arquitetura de</tspan></text>
    <text x="60" y="408"><tspan font-weight="700" fill="#f2f8fc">neg&#243;cio e ciberseguran&#231;a</tspan>, garantindo que a escalabilidade agressiva do</text>
    <text x="60" y="434">neg&#243;cio n&#227;o comprometa a estabilidade, a performance de I/O ou a prote&#231;&#227;o</text>
    <text x="60" y="460">dos dados.</text>
  </g>

  <line x1="60" y1="482" x2="940" y2="482" stroke="#16283d" stroke-width="1"/>

  <text x="60" y="536" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#f2f8fc">GITHUB ANALYTICS</text>
  <rect x="306" y="514" width="12" height="26" fill="#00e0ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
